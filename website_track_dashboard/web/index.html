  <style>

    @font-face {
      font-family: 'Plus Jakarta Sans';
      src: url('assets/fonts/PlusJakartaSans.ttf') format('truetype');
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
    }

    @font-face {
      font-family: 'JetBrains Mono';
      src: url('assets/fonts/JetBrainsMono.ttf') format('truetype');
      font-style: normal;
      font-weight: 100 800;
      font-display: swap;
    }

    #viziapi-shell {
      position: fixed;
      inset: 0;
      z-index: 99999;
      overflow: hidden;
      background: #07090d;
      color: #f7f8fa;
      font-family: 'Plus Jakarta Sans', Arial, 'Segoe UI', sans-serif;
      transition: opacity .42s ease, visibility .42s ease;
    }

    #viziapi-shell.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .landing-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(255,255,255,.045) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,.045) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.96) 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, #000 0%, rgba(0,0,0,.96) 70%, transparent 100%);
    }

    .landing-glow {
      position: absolute;
      width: 620px;
      height: 360px;
      left: 50%;
      top: 38px;
      transform: translateX(-50%);
      background: radial-gradient(ellipse, rgba(255,83,36,.09) 0%, rgba(255,83,36,.035) 42%, transparent 72%);
      filter: blur(10px);
      pointer-events: none;
      animation: heroGlow 7s ease-in-out infinite alternate;
    }

    .landing-hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 56px 24px 56px;
    }

    .viziapi-loader {
      position: relative;
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }

    .viziapi-loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px solid rgba(255,106,58,.16);
      border-top-color: #ff6a3a;
      animation: viziapiSpin 1.1s linear infinite;
    }

    .viziapi-loader-logo {
      position: relative;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      animation: viziapiPulse 1.8s ease-in-out infinite;
    }

    @keyframes viziapiSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes viziapiPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(.92); opacity: .78; }
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 17px;
      border: 1px solid rgba(255,79,33,.48);
      border-radius: 999px;
      background: rgba(255,79,33,.10);
      color: #ff6a3a;
      font: 650 12px/1 'JetBrains Mono', Consolas, 'Courier New', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
      box-shadow: inset 0 0 20px rgba(255,79,33,.04);
    }

    .hero-title {
      margin: 27px auto 0;
      max-width: 1080px;
      font: 800 clamp(54px, 6.3vw, 92px)/.94 'Plus Jakarta Sans', Arial, 'Segoe UI', sans-serif;
      letter-spacing: -.067em;
      text-wrap: balance;
      color: #f4f5f7;
      animation: heroTextIn .75s cubic-bezier(.2,.8,.2,1) both;
    }

    .hero-title span {
      display: block;
    }

    .hero-subtitle {
      max-width: 760px;
      margin: 32px auto 0;
      color: #98a3b5;
      font: 400 clamp(17px, 1.55vw, 22px)/1.55 'Plus Jakarta Sans', Arial, 'Segoe UI', sans-serif;
      letter-spacing: -.022em;
      text-wrap: balance;
      animation: heroTextIn .85s .08s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes heroTextIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes heroGlow {
      from { opacity: .68; transform: translateX(-50%) scale(.96); }
      to { opacity: 1; transform: translateX(-50%) scale(1.05); }
    }

    @media (max-width: 620px) {
      .eyebrow {
        min-height: 31px;
        padding: 0 13px;
        font-size: 10px;
      }
      .hero-title {
        margin-top: 22px;
        font-size: clamp(44px, 13vw, 62px);
        letter-spacing: -.062em;
      }
      .hero-subtitle {
        margin-top: 24px;
        font-size: 16px;
      }
      .landing-glow {
        width: 420px;
        height: 300px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #viziapi-shell *, #viziapi-shell {
        animation: none !important;
        transition: none !important;
      }
    }

    html, body {
      background-color: #090A0F;
      background-image:
        radial-gradient(circle at 50% -15%, rgba(255, 87, 34, 0.12) 0%, rgba(255, 87, 34, 0.035) 45%, transparent 75%),
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
      background-size: 100% 100%, 80px 80px, 80px 80px;
      background-repeat: no-repeat, repeat, repeat;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', Arial, 'Segoe UI', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #090A0F; }
    ::-webkit-scrollbar-thumb { background: #232B3A; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #344055; }
  </style>

  <div id="viziapi-shell" aria-label="ViziAPI landing page preview">

        <span class="viziapi-loader-ring" aria-hidden="true"></span>
        <img class="viziapi-loader-logo" src="favicon.png" width="44" height="44" alt="ViziAPI logo">
      </div>

      <div class="eyebrow">LIGHTWEIGHT WEBSITE ANALYTICS</div>

      <h1 class="hero-title">
        <span>Understand your traffic.</span>
        <span>See who comes back.</span>
      </h1>

      <p class="hero-subtitle">
        A focused analytics API for developer-built websites. One lightweight script for
        anonymous visitors, sessions, page views, events, and realtime presence.
      </p>
    </main>
  </div>
